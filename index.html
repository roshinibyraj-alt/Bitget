<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Signal Bot Dashboard</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f6fa;color:#1a1a2e;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:13px;line-height:1.5}
header{background:#fff;border-bottom:2px solid #e8e8f0;padding:10px 14px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.hrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.logo{font-weight:900;font-size:15px;color:#1a1a2e;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px}
.dot.on{background:#22c55e;box-shadow:0 0 6px #22c55e}
.dot.off{background:#ef4444}
.badge{padding:2px 8px;border-radius:4px;font-size:9px;font-weight:700;letter-spacing:.5px}
.badge.live{background:#fef2f2;color:#dc2626;border:1px solid #fca5a5}
.badge.demo{background:#eff6ff;color:#2563eb;border:1px solid #93c5fd}
.badge.signal{background:#f0fdf4;color:#16a34a;border:1px solid #86efac}
.stats{display:flex;gap:5px;flex-wrap:wrap}
.stat{background:#f8f9fe;border:1px solid #e8e8f0;border-radius:8px;padding:4px 10px;text-align:center;min-width:70px}
.stat .sl{font-size:8px;color:#6b7280;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.stat .sv{font-size:13px;font-weight:800}
.g{color:#16a34a}.r{color:#dc2626}.y{color:#d97706}.b{color:#2563eb}.w{color:#1a1a2e}.gr{color:#6b7280}
main{padding:10px;max-width:1200px;margin:0 auto}
.card{background:#fff;border:1px solid #e8e8f0;border-radius:10px;padding:12px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,0.04)}
.card-title{font-size:9px;font-weight:800;margin-bottom:10px;text-transform:uppercase;color:#6b7280;letter-spacing:.6px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f1f1f8;padding-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:11px}
th{text-align:left;color:#6b7280;font-size:8px;text-transform:uppercase;padding:4px 3px;border-bottom:1px solid #f1f1f8;font-weight:700;letter-spacing:.4px}
td{padding:4px 3px;border-bottom:1px solid #f8f9fe;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
input,select{background:#f8f9fe;border:1px solid #e8e8f0;border-radius:6px;padding:6px 8px;font-size:12px;color:#1a1a2e;width:100%}
button{background:#2563eb;color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:11px;font-weight:700;cursor:pointer}
button:active{transform:scale(0.97)}
.notice{background:#fef2f2;border:1.5px solid #fca5a5;border-radius:8px;padding:10px 14px;margin-bottom:10px;font-size:11px;color:#991b1b;font-weight:600}
.empty{text-align:center;padding:30px;color:#9ca3af;font-size:13px}
.log-line{padding:2px 0;border-bottom:1px solid #f8f9fe;font-size:10px;font-family:monospace;color:#374151}
footer{text-align:center;padding:10px;color:#9ca3af;font-size:9px;border-top:1px solid #e8e8f0;margin-top:10px}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="logo"><span class="dot off" id="dot"></span>Signal Bot</div>
    <span class="badge demo" id="modeBadge">DEMO</span>
    <div class="stats" id="headerStats"></div>
  </div>
</header>
<main>
  <div class="grid2">
    <div class="card" id="signalCard">
      <div class="card-title">📨 Submit Signal</div>
      <div style="display:grid;grid-template-columns:1fr 2fr;gap:6px;font-size:11px">
        <select id="sigDir" style="grid-column:1">
          <option value="LONG">LONG</option>
          <option value="SHORT">SHORT</option>
        </select>
        <input id="sigPair" placeholder="Pair (BTC, ETH, SOL...)" style="grid-column:2">
        <input id="sigEntry" placeholder="Entry (optional)" style="grid-column:1/3">
        <input id="sigTp" placeholder="Take Profit" style="grid-column:1">
        <input id="sigSl" placeholder="Stop Loss" style="grid-column:2">
        <button onclick="sendSignal()" style="grid-column:1/3;padding:8px">🚀 Send Signal</button>
      </div>
      <div id="signalResult" style="margin-top:6px;font-size:11px;color:#6b7280"></div>
    </div>
    <div class="card">
      <div class="card-title">📡 Signal Sources</div>
      <div id="sourceBody"><div class="empty">No signal sources yet</div></div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">📊 Open Positions</div>
    <div id="posBody"><div class="empty">No open positions</div></div>
  </div>
  <div class="grid2">
    <div class="card">
      <div class="card-title">📋 Signal Log</div>
      <div id="signalLogBody"><div class="empty">No signals yet</div></div>
    </div>
    <div class="card">
      <div class="card-title">📜 Trade History</div>
      <div id="tradeBody"><div class="empty">No trades yet</div></div>
    </div>
  </div>
</main>
<footer id="footer">Signal Bot | loading...</footer>

<script>
var socket=io({transports:['websocket','polling'],reconnection:true,reconnectionDelay:1000});

function f2(v){return typeof v==='number'?v.toFixed(2):'0.00';}
function f4(v){return typeof v==='number'?v.toFixed(4):'0.0000';}
function cls(v){return v>0?'g':v<0?'r':'gr';}
function sgn(v){return v>0?'+':'';}

function sendSignal(){
  var dir=document.getElementById('sigDir').value;
  var pair=document.getElementById('sigPair').value.trim().toUpperCase().replace(/USDT$/g,'');
  var entry=document.getElementById('sigEntry').value.trim();
  var tp=document.getElementById('sigTp').value.trim();
  var sl=document.getElementById('sigSl').value.trim();
  if(!pair)return alert('Enter a pair');
  fetch('/api/signal',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({direction:dir,pair:pair,entry:entry||null,tp:tp||null,sl:sl||null})})
    .then(function(r){return r.json();})
    .then(function(j){
      document.getElementById('signalResult').textContent=j.ok?'✅ Signal submitted':('❌ '+j.error);
    })
    .catch(function(e){document.getElementById('signalResult').textContent='❌ '+e.message;});
}

function render(d){
  if(!d)return;
  document.getElementById('dot').className='dot on';
  document.getElementById('modeBadge').textContent=d.demo?'DEMO $'+f2(d.demoBalance):'LIVE';
  document.getElementById('modeBadge').className=d.demo?'badge demo':'badge live';

  var h='';
  h+='<div class="stat"><div class="sl">Balance</div><div class="sv w">$'+f2(d.balance)+'</div></div>';
  h+='<div class="stat"><div class="sl">PnL</div><div class="sv '+cls(d.totalPnl)+'">'+sgn(d.totalPnl)+'$'+f2(d.totalPnl)+'</div></div>';
  h+='<div class="stat"><div class="sl">Open</div><div class="sv b">'+d.activePositions+'</div></div>';
  h+='<div class="stat"><div class="sl">Trades</div><div class="sv w">'+d.totalTrades+'</div></div>';
  h+='<div class="stat"><div class="sl">Win Rate</div><div class="sv '+cls(d.winRate-50)+'">'+f2(d.winRate)+'%</div></div>';
  h+='<div class="stat"><div class="sl">Size</div><div class="sv gr">'+(d.capitalPct*100)+'% ×'+d.leverage+'x</div></div>';
  document.getElementById('headerStats').innerHTML=h;

  // Open positions
  var pc='';
  if(!d.positions||!d.positions.length){pc='<div class="empty">No open positions</div>';}
  else{
    pc+='<table><tr><th>Source</th><th>Pair</th><th>Dir</th><th>Entry</th><th>Current</th><th>TP</th><th>SL</th><th>Size</th><th>Unreal</th><th>Age</th></tr>';
    for(var p of d.positions){
      var upCls=cls(p.unrealizedPnl);
      var ageStr=p.age>3600?Math.floor(p.age/3600)+'h':Math.floor(p.age/60)+'m';
      pc+='<tr><td>'+(p.sourceName||'?')+'</td><td>'+p.pair+'</td>'+
        '<td><span class="badge '+(p.direction==='LONG'?'badge signal':'')+'">'+p.direction+'</span></td>'+
        '<td>$'+f4(p.entryPrice)+'</td><td>$'+f4(p.currentPrice)+'</td>'+
        '<td class="g">$'+(p.tp?f4(p.tp):'-')+'</td><td class="r">$'+(p.sl?f4(p.sl):'-')+'</td>'+
        '<td>'+p.size+'</td><td class="'+upCls+'">'+sgn(p.unrealizedPnl)+'$'+f2(p.unrealizedPnl)+'</td>'+
        '<td>'+ageStr+'</td></tr>';
    }
    pc+='</table>';
  }
  document.getElementById('posBody').innerHTML=pc;

  // Sources
  var sc='';
  if(!d.sources||!d.sources.length){sc='<div class="empty">No signal sources yet</div>';}
  else{
    sc+='<table><tr><th>Source</th><th>Signals</th><th>W</th><th>L</th><th>Accuracy</th><th>Status</th><th>Size</th></tr>';
    for(var s of d.sources){
      var accCls=s.accuracy>=70?'g':s.accuracy>=50?'y':'r';
      sc+='<tr><td>'+(s.id.length>12?s.id.slice(0,12)+'..':s.id)+'</td>'+
        '<td>'+s.total+'</td><td class="g">'+s.wins+'</td><td class="r">'+s.losses+'</td>'+
        '<td class="'+accCls+'">'+f2(s.accuracy)+'%</td>'+
        '<td>'+s.active+'</td><td>'+s.sizeLabel+'</td></tr>';
    }
    sc+='</table>';
  }
  document.getElementById('sourceBody').innerHTML=sc;

  // Signal log
  var slc='';
  if(!d.signals||!d.signals.length){slc='<div class="empty">No signals yet</div>';}
  else{
    slc+='<table><tr><th>Source</th><th>Dir</th><th>Pair</th><th>Entry</th><th>TP</th><th>SL</th></tr>';
    for(var s of d.signals.slice(0,20)){
      slc+='<tr><td>'+(s.sourceName||'?')+'</td><td><span class="badge '+(s.direction==='LONG'?'badge signal':'')+'">'+s.direction+'</span></td>'+
        '<td>'+s.pair+'</td><td>$'+(s.entryPrice?f4(s.entryPrice):'mkt')+'</td>'+
        '<td class="g">$'+(s.tp?f4(s.tp):'-')+'</td><td class="r">$'+(s.sl?f4(s.sl):'-')+'</td></tr>';
    }
    slc+='</table>';
  }
  document.getElementById('signalLogBody').innerHTML=slc;

  // Trade history
  var tc='';
  if(!d.trades||!d.trades.length){tc='<div class="empty">No trades yet</div>';}
  else{
    tc+='<table><tr><th>Source</th><th>Pair</th><th>Dir</th><th>Entry</th><th>Exit</th><th>Reason</th><th>PnL</th></tr>';
    for(var t of d.trades.slice(0,20)){
      tc+='<tr><td>'+(t.sourceName||'?')+'</td><td>'+t.symbol+'</td>'+
        '<td><span class="badge '+(t.direction==='LONG'?'badge signal':'')+'">'+t.direction+'</span></td>'+
        '<td>$'+f4(t.entryPrice)+'</td><td>$'+f4(t.exitPrice)+'</td>'+
        '<td>'+t.exitReason+'</td><td class="'+cls(t.pnl)+'">'+sgn(t.pnl)+'$'+f2(t.pnl)+'</td></tr>';
    }
    tc+='</table>';
  }
  document.getElementById('tradeBody').innerHTML=tc;

  var up=d.uptime||0;
  var upStr=up>3600?Math.floor(up/3600)+'h '+Math.floor((up%3600)/60)+'m':up>60?Math.floor(up/60)+'m '+(up%60)+'s':up+'s';
  document.getElementById('footer').textContent='Signal Bot | '+d.strategy+' | uptime: '+upStr+(d.telegram?' | 🤖 Telegram':'');
}

socket.on('connect',    function(){document.getElementById('dot').className='dot on';});
socket.on('disconnect', function(){document.getElementById('dot').className='dot off';});
socket.on('snapshot',   function(d){if(d)render(d);});

setInterval(function(){
  fetch('/api/snapshot').then(function(r){return r.json();}).then(function(d){if(d)render(d);}).catch(function(){});
}, 5000);
</script>
</body>
</html>
