<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bitget Candle Bot</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b0e17;--bg2:#131722;--bg3:#1a1f2e;--bg4:#232941;--border:#2a304a;--green:#00c853;--red:#ff1744;--gold:#ffd600;--blue:#448aff;--purple:#7c4dff;--cyan:#00e5ff;--muted:#6b7394;--white:#e8eaf0;--radius:10px}
body{background:var(--bg);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}
header{background:linear-gradient(135deg,var(--bg2),var(--bg3));border-bottom:1px solid var(--border);padding:10px 14px;position:sticky;top:0;z-index:100}
.top-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-weight:800;font-size:16px;background:linear-gradient(135deg,var(--cyan),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.on{background:var(--green);box-shadow:0 0 8px var(--green)}
.dot.off{background:var(--red);box-shadow:0 0 8px var(--red)}
.dot.idle{background:var(--muted)}
.stats{display:flex;gap:5px;flex-wrap:wrap}
.stat{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:5px 10px;text-align:center;min-width:62px}
.stat .sl{font-size:7px;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px}
.stat .sv{font-size:14px;font-weight:800}
.stat .sv.g{color:var(--green)}
.stat .sv.r{color:var(--red)}
.stat .sv.gold{color:var(--gold)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;max-width:1100px;margin:0 auto}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.card-title{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:10px 12px 6px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.card-body{padding:8px 10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:11px}
th{text-align:left;color:var(--muted);font-size:8px;text-transform:uppercase;padding:5px 4px;border-bottom:1px solid var(--border);font-weight:700;letter-spacing:0.5px}
td{padding:5px 4px;border-bottom:1px solid var(--bg4);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg3)}
.badge{font-size:8px;padding:2px 7px;border-radius:4px;font-weight:700;display:inline-block}
.badge-buy{background:rgba(0,200,83,0.12);color:var(--green)}
.badge-sell{background:rgba(255,23,68,0.12);color:var(--red)}
.badge-open{background:rgba(68,138,255,0.12);color:var(--blue)}
.badge-12h{background:rgba(255,152,0,0.15);color:#ff9800}
.badge-1d{background:rgba(124,77,255,0.12);color:var(--purple)}
.badge-15m{background:rgba(0,200,83,0.12);color:var(--green)}
.badge-1h{background:rgba(0,229,255,0.12);color:var(--cyan)}
.badge-4h{background:rgba(255,214,0,0.12);color:var(--gold)}
.empty{text-align:center;padding:20px;color:var(--muted);font-size:12px}
.mode-tag{font-size:8px;padding:3px 8px;border-radius:4px;font-weight:700}
.mode-live{background:rgba(0,200,83,0.15);color:var(--green)}
.mode-dry{background:rgba(255,214,0,0.15);color:var(--gold)}
.mode-demo{background:rgba(68,138,255,0.15);color:var(--blue)}
.sig-cell{font-size:9px;text-align:center;padding:2px 4px}
.candle-green{color:var(--green)}
.candle-red{color:var(--red)}
.wr{white-space:nowrap}
</style>
</head>
<body>
<header>
  <div class="top-row">
    <div class="logo"><span class="dot" id="hd-dot">●</span>Bitget Candle Bot</div>
    <div style="font-size:9px;color:var(--muted)" id="hd-mode"></div>
    <button onclick="runBacktest()" style="margin-left:auto;background:var(--bg4);color:var(--white);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:10px;cursor:pointer">📊 Backtest 1 Month</button>
    <span id="bt-status" style="font-size:9px;color:var(--muted)"></span>
    <div class="stats">
      <div class="stat"><div class="sl">Capital</div><div class="sv" id="hd-bal">$0</div></div>
      <div class="stat"><div class="sl">Available</div><div class="sv" id="hd-avl">$0</div></div>
      <div class="stat"><div class="sl">Locked</div><div class="sv" id="hd-lck" style="color:var(--muted)">$0</div></div>
      <div class="stat"><div class="sl">P&L</div><div class="sv" id="hd-pnl">$0</div></div>
      <div class="stat"><div class="sl">Win</div><div class="sv g" id="hd-win">0</div></div>
      <div class="stat"><div class="sl">Loss</div><div class="sv r" id="hd-loss">0</div></div>
      <div class="stat"><div class="sl">Win%</div><div class="sv gold" id="hd-wr">0%</div></div>
      <div class="stat"><div class="sl">Fees</div><div class="sv" id="hd-fees" style="color:var(--muted)">$0</div></div>
    </div>
  </div>
</header>
<div class="grid">
  <!-- Positions Card -->
  <div class="card">
    <div class="card-title">Active Positions <span id="pos-count">(0)</span></div>
    <div class="card-body" id="pos-list"><div class="empty">No active positions</div></div>
  </div>

  <!-- Trade History Card -->
  <div class="card">
    <div class="card-title">Trade History <span id="trade-count">(0)</span></div>
    <div class="card-body" id="trade-list"><div class="empty">No trades yet</div></div>
  </div>

  <!-- Pairs Card -->
  <div class="card">
    <div class="card-title">Top 20 Pairs <span id="pair-count">(0)</span></div>
    <div class="card-body" id="pair-list"><div class="empty">Scanning pairs...</div></div>
  </div>

  <!-- Signal Log Card -->
  <div class="card">
    <div class="card-title">Signal Log <span id="sig-count">(0)</span></div>
    <div class="card-body" id="sig-list"><div class="empty">No signals yet</div></div>
  </div>
  <!-- Backtest Results Card -->
  <div class="card">
    <div class="card-title">Backtest Results <span id="bt-count"></span></div>
    <div class="card-body" id="bt-list"><div class="empty">Click "Backtest 1 Month" to run</div></div>
  </div>
</div>

<script>
(function(){
var s=io();
function fmt(v){return typeof v==='number'?v.toFixed(v<0.01?6:v<1?4:2):v||0}
function fmtS(v){return typeof v==='number'?(v>1000?(v/1000).toFixed(1)+'k':v.toFixed(v<1?4:0)):v||0}
function fmtP(v){return (v>=0?'+':'')+v.toFixed(2)}
function cls(v){return (v||0)>=0?'var(--green)':'var(--red)'}

function render(d){
  if(!d)return;
  // Header dot
  var dot=document.getElementById('hd-dot');
  if(d.positions&&d.positions.length>0){dot.className='dot on'}else{dot.className='dot idle'}
  
  document.getElementById('hd-mode').innerHTML='<span class="mode-tag mode-demo">DEMO 4H • Compound</span> <span style="font-size:8px;color:var(--muted)">'+d.pairs.length+'p</span>';
  document.getElementById('hd-bal').textContent='$'+fmt(d.balance);
  document.getElementById('hd-avl').textContent='$'+fmt(d.available||d.balance);
  document.getElementById('hd-lck').textContent='$'+fmt(d.locked||0);
  var pnlEl=document.getElementById('hd-pnl');
  pnlEl.textContent='$'+fmtP(d.totalPnl);
  pnlEl.style.color=(d.totalPnl||0)>=0?'var(--green)':'var(--red)';
  document.getElementById('hd-win').textContent=d.wins||0;
  document.getElementById('hd-loss').textContent=d.losses||0;
  document.getElementById('hd-wr').textContent=(d.winRate||0)+'%';
  document.getElementById('hd-fees').textContent='$'+fmt(d.totalFees);
  
  // Positions
  var pos=d.positions||[];
  document.getElementById('pos-count').textContent='('+pos.length+')';
  var pl=document.getElementById('pos-list');
  if(!pos.length){
    pl.innerHTML='<div class="empty">No active positions</div>';
  }else{
    var h='<table><tr><th>Pair</th><th>Side</th><th>Entry</th><th>Mark</th><th>Size</th><th>Contracts</th><th>Unreal PnL</th><th>TF</th><th>SL</th><th>Remaining</th></tr>';
    pos.forEach(function(p){
      var sideCls=p.direction==='BUY'?'badge-buy':'badge-sell';
      var sideTxt=p.direction==='BUY'?'LONG':'SHORT';
      var uPnl=p.unrealizedPnl||0;
      var tfCls='badge-4h';
      var remaining=p.tpTime?Math.max(0,Math.floor((p.tpTime-Date.now())/60000))+'m':'—';
      h+='<tr>'+
        '<td><strong>'+p.symbol+'</strong></td>'+
        '<td><span class="badge '+sideCls+'">'+sideTxt+'</span></td>'+
        '<td>$'+fmt(p.entryPrice)+'</td>'+
        '<td>$'+fmt(p.markPrice||p.entryPrice)+'</td>'+
        '<td>$'+fmt(p.size)+'</td><td>'+fmtS(p.contracts)+'c</td>'+
        '<td style="color:'+(uPnl>=0?'var(--green)':'var(--red)')+'">$'+fmtP(uPnl)+'</td>'+
        '<td><span class="badge '+tfCls+'">'+p.timeframe+'</span></td>'+
        '<td>$'+fmt(p.slPrice)+'</td>'+
        '<td style="color:var(--muted);font-size:9px">'+remaining+'</td>'+
      '</tr>';
    });
    h+='</table>';
    pl.innerHTML=h;
  }
  
  // Signals
  var sigs=d.signals||[];
  document.getElementById('sig-count').textContent='('+sigs.length+')';
  var sl=document.getElementById('sig-list');
  if(!sigs.length){
    sl.innerHTML='<div class="empty">No signals yet</div>';
  }else{
    var sh='';
    sigs.forEach(function(s){
      var sideCls=s.direction==='BUY'?'badge-buy':'badge-sell';
      var tf=s.timeframe||'—';
      var tfCls='badge-4h';
      var candleDir=s.side && s.side.indexOf('long')>=0 ? '🟢' : '🔴';
      var candleLabel=s.candleOpen && s.candleClose 
        ? (s.candleClose > s.candleOpen ? '🟢 GREEN' : '🔴 RED')
        : '';
      sh+='<div class="signal-item">'+
        '<span class="badge '+tfCls+'">'+tf+'</span>'+
        '<span class="badge '+sideCls+'">'+(s.direction==='BUY'?'LONG':'SHORT')+'</span>'+
        '<strong>'+s.symbol+'</strong>'+
        '<span style="font-size:8px;color:var(--muted)">@ $'+fmt(s.entryPrice)+'</span>'+
        '<span style="font-size:8px;color:var(--muted)">| C: $'+fmt(s.candleOpen)+'→$'+fmt(s.candleClose)+' '+candleLabel+'</span>'+
        '<span style="color:var(--muted);font-size:8px;margin-left:auto">'+new Date(s.time).toLocaleTimeString()+'</span>'+
      '</div>';
    });
    sl.innerHTML=sh;
  }
  
  // Pairs
  var pairs=d.pairs||[];
  document.getElementById('pair-count').textContent='('+pairs.length+')';
  var pl2=document.getElementById('pair-list');
  if(!pairs.length){
    pl2.innerHTML='<div class="empty">Scanning pairs...</div>';
  }else{
    var tfs=['4H'];
    var p2h='<table><tr><th>Pair</th><th>Price</th><th>24h Chg</th><th>4H</th><th>Signal</th></tr>';
    pairs.forEach(function(p){
      var sigHtml='<span style="color:var(--muted);font-size:9px">—</span>';
      if(p.lastSignal){
        sigHtml='<span class="badge '+(p.lastSignal==='BUY'?'badge-buy':'badge-sell')+'">'+(p.lastSignal==='BUY'?'LONG':'SHORT')+'</span>';
      }
      function candleCell(pair,tf){
        var lc=pair.lastCandle||{};
        var tfLc=lc[tf]||{};
        if(!tfLc.close) return '<td style="color:var(--muted);font-size:9px;text-align:center">—</td>';
        var icon=tfLc.close>tfLc.open?'<span class="candle-green">🟢</span>':'<span class="candle-red">🔴</span>';
        return '<td style="font-size:10px;text-align:center" class="wr">'+icon+'</td>';
      }
      p2h+='<tr>'+
        '<td><strong>'+p.symbol+'</strong></td>'+
        '<td>$'+fmt(p.price)+'</td>'+
        '<td style="color:'+cls(p.change)+'">'+(p.change? (p.change>0?'+':'')+p.change.toFixed(2)+'%':'—')+'</td>'+
        candleCell(p,'4H')+
        '<td>'+sigHtml+'</td>'+
      '</tr>';
    });
    p2h+='</table>';
    pl2.innerHTML=p2h;
  }
  
  // Trades
  var trades=d.trades||[];
  document.getElementById('trade-count').textContent='('+trades.length+')';
  var tl=document.getElementById('trade-list');
  if(!trades.length){
    tl.innerHTML='<div class="empty">No trades yet</div>';
  }else{
    var th='<table><tr><th>Pair</th><th>Side</th><th>Entry</th><th>Exit</th><th>Contracts</th><th>PnL</th><th>TF</th><th>Reason</th><th>Time</th></tr>';
    trades.forEach(function(t){
      var sCls=t.direction==='BUY'?'badge-buy':'badge-sell';
      var sTxt=t.direction==='BUY'?'LONG':'SHORT';
      var tPnl=t.pnl||0;
      var tfCls='badge-4h';
      var reasonBadge=t.exitReason==='SL'?'🔴 SL':'🟢 TP';
      th+='<tr>'+
        '<td><strong>'+t.symbol+'</strong></td>'+
        '<td><span class="badge '+sCls+'">'+sTxt+'</span></td>'+
        '<td>$'+fmt(t.entryPrice)+'</td>'+
        '<td>$'+fmt(t.exitPrice||0)+'</td>'+
        '<td>'+fmtS(t.contracts)+'c</td>'+
        '<td style="color:'+(tPnl>=0?'var(--green)':'var(--red)')+'">$'+fmtP(tPnl)+'</td>'+
        '<td><span class="badge '+tfCls+'">'+(t.timeframe||'—')+'</span></td>'+
        '<td style="font-size:9px">'+reasonBadge+'</td>'+
        '<td style="color:var(--muted);font-size:8px">'+new Date(t.closeTime||t.time).toLocaleDateString()+' '+new Date(t.closeTime||t.time).toLocaleTimeString()+'</td>'+
      '</tr>';
    });
    th+='</table>';
    tl.innerHTML=th;
  }
}

s.on('snapshot',function(d){if(d)render(d);});
setInterval(function(){
  fetch('/api/snapshot').then(function(r){return r.json();}).then(function(d){if(d)render(d);}).catch(function(){});
}, 3000);

function runBacktest(){
  var btn=document.querySelector('button');
  var st=document.getElementById('bt-status');
  btn.disabled=true; st.textContent='Running...';
  fetch('/api/backtest?pairs=5').then(function(r){return r.json();}).then(function(d){
    st.textContent=d.message||'Error';
    setTimeout(checkBacktestResult, 1000);
  }).catch(function(){st.textContent='Failed';btn.disabled=false;});
}

function checkBacktestResult(){
  fetch('/api/backtest/result').then(function(r){return r.json();}).then(function(d){
    if(!d||d.status==='not_run'){setTimeout(checkBacktestResult,2000);return;}
    renderBacktest(d);
    document.querySelector('button').disabled=false;
    document.getElementById('bt-status').textContent='Done';
  }).catch(function(){setTimeout(checkBacktestResult,2000);});
}

function renderBacktest(d){
  var el=document.getElementById('bt-list');
  document.getElementById('bt-count').textContent='('+d.overall.trades+' trades)';
  var h='<table style="font-size:10px"><tr><th>Metric</th><th>Value</th></tr>';
  var tfs=d.timeframe||{};
  function cell(tf,key){var v=tf?tf[key]:0;return typeof v==='number'?fmt(v):v;}
  h+='<tr><td><strong>Trades</strong></td><td>'+d.overall.trades+'</td></tr>';
  h+='<tr><td><strong>Win Rate</strong></td><td>'+d.overall.winRate+'%</td></tr>';
  h+='<tr><td><strong>PnL</strong></td><td style="color:'+cls(d.overall.pnl)+'">$'+fmtP(d.overall.pnl)+'</td></tr>';
  h+='<tr><td><strong>Fees</strong></td><td>$'+fmt(d.overall.fees)+'</td></tr>';
  h+='<tr><td><strong>ROI</strong></td><td>'+d.overall.roi+'%</td></tr>';
  h+='</table>';
  el.innerHTML=h;
}
})();
</script>
</body>
</html>
